# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsw.ps
long_name: Store word packed single
description: |
  Store all eight 32-bit elements (256 bits) from a packed-single register to consecutive memory.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -----------------110-----0001011
  variables:
    - name: imm
      location: 31-25|11-7
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
assembly: fs2, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  addr = rs1 + sext(offset, 64);
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) MEM(addr + 4*i, 32) = fs2.e<i>;
  }
