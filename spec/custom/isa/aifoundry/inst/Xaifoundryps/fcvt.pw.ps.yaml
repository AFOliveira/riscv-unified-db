# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.pw.ps
long_name: Floating point convert packed signed word packed single
description: |
  Converts the single-precision values in vector register fs1 to signed 32-bit integers, using the rounding mode specified in the rm field, and writes the results to vector register fd.
  If the rounded result is not representable in the destination format, it is clipped to the nearest value and the invalid
  flag is set.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 110000000000-------------1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: rd
      location: 11-7
assembly: fd, fs1, rm
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  fd.e<i> = f32_to_i32(fs1.e<i>);
  }
