# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorstorefromscp
long_name: TensorStoreFromScp
description: |
  Store data directly from L1 scratchpad to memory.
  Encoded as CSRRW to tensor_store CSR (0x87F).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100001111111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  step = STEP + 1;
  src = START;
  rows = ROWS + 1;
  VA = sext(ADDR << 6, 64);
  stride = zext((STRIDE & ~3) << 4, 64);
  for (i = 0; i < rows; i++) {
  MEM(VA + i*stride, 512) = L1Scp[(src + i*step) % 48][*];
  }
