# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flw.ps
long_name: Floating point load word packed single
description: |
  Loads 256 consecutive bits from memory and stores them in eight consecutive elements of the
  destination (fd) register, e0 through e7. The e0 register stores bits 31:0, and the e7 register stores bits 255:224.
  The effective address of the load is calculated by adding a signed immediate offset to the value in register rs1. The
  mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: -----------------010-----0001011
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, offset(rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  addr = rs1 + sext(offset, 64);
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e0 = MEM(addr + 4*i, 32);
  }
