# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: excl_mode
long_name: Exclusive Mode Control
address: 0x7D3
priv_mode: M
length: 64
writable: true
description: |
  Controls the multi-hart exclusion mechanism. When a hart sets the ENABLE bit,
  all other harts in the same Shire are halted, granting the requesting hart
  exclusive access to shared resources. This is used for critical sections that
  require single-hart execution without interference from other cores.
definedBy:
  name: Xaifoundry
fields:
  ENABLE:
    location: 0
    type: RW
    reset_value: 0
    description: Exclusive mode enable.
