# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: mova.m.x
long_name: Move register M to eight least significant bits from all X registers.
description: |
  The MOVA.M.X instruction moves data from a single 64-bit X register specified by the rs1 field (bits
  19:15) of the instruction into all eight 8-bit M registers (m7:m0). It takes the value in the 64-bit X register, distributes
  the doubleword into eight 8-bit bytes, and stores the value to all eight 8-bit M registers, with bits 63:56 being written
  to register m7, and bits 7:0 being written to register m0.

  Exceptions: None
  Restrictions: None
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrymask
encoding:
  match: 110101100000-----001000001111011
  variables:
    - name: rs1
      location: 19-15
assembly: rs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  m0 = rs1[7:0]
  m1 = rs1[15:8]
  m2 = rs1[23:16]
  m3 = rs1[31:24]
  m4 = rs1[39:32]
  m5 = rs1[47:40]
  m6 = rs1[55:48]
  m7 = rs1[63:56]
