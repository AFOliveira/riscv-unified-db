# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: amoming.w
long_name: Atomic minimum global word
description: |
  Global atomic 32-bit minimum operation between the value in integer register 'rs2' and the value in
  the memory address pointed by integer register 'rs1'. The original value in memory is returned in integer register
  'rd'.

  Exceptions: Virtual address (rs1) must be aligned to a 4 byte boundary. Otherwise an access fault exception is
  generated.
  Restrictions: None
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryamo
encoding:
  match: 1000001----------010-----0111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: rd, rs2, (rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  rd = atomic_global_min(rs1, rs2, 32)
