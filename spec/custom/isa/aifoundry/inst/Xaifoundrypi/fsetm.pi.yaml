# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsetm.pi
long_name: Packed integer set mask register
description: |
  Writes the value 1 to each mask register md bit if the corresponding 32-bit integer value in vector register fs1 is not equal to zero, otherwise writes the value 0.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 101001100000-----10000---1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 9-7
assembly: md, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) md.bit<i> = (fs1.e<i> != 0) ? 1 : 0;
  }
