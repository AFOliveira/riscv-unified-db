# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmvs.x.ps
long_name: Floating point move floating point register to integer register sign-extend, packed single
description: |
  Extracts the single-precision element, indexed by the immediate operand, from vector register fs1,
  sign-extends the value to XLEN bits, and writes the result to integer register rd. The bits are not modified in the
  transfer, and in particular, the payloads of non-canonical NaNs are preserved.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 111000000--------010-----1111011
  variables:
    - name: idx
      location: 22-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: rd, fs1, index
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  rd = sext(fs1.e<index>, 64);
