# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsc32b.ps
long_name: Restricted byte scatter on 32-byte area packed single
description: |
  Writes the 8 low order bits of each 32-bit element of register fd to a 32-byte aligned, 256-bit wide,
  block of memory, where the n-th 8-bit value is written to the m-th location of the block as specified by bits 5n+4:5n
  of rs1. The effective address of the store is taken by bits 63:5 of rs2.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update memory.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 1000100----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rs3
      location: 11-7
assembly: fd, rs1(rs2)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  addr = rs2[63:5] << 5;
  for (i = 0; i < VLEN/32; i++) {
  m = (rs2[4:0] + rs1[5*n+4:5*n]) % 32;
  if (m0.bit<i>) MEM(addr + m, 8) = fd.e<i>[7:0];
  }
