# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fslli.pi
long_name: Packed integer shift left logical immediate
description: |
  Perform element-wise logical left shift across all 8 INT32 lanes of the
  packed integer source register by the immediate shift amount, writing the
  result to the destination packed integer register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 0100111----------001-----1111011
  variables:
    - name: shamt
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, shamt
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = fs1.e<i> << imm5;
  }
