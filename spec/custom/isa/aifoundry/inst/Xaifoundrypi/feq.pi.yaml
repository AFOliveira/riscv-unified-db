# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: feq.pi
long_name: Packed integer equal to comparison
description: |
  Writes all 1s to each 32-bit element in register fd if the corresponding 32-bit integer value in vector
  register fs1 is equal to the 32-bit integer value in vector register fs2, otherwise writes the value 0.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 1010011----------010-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = (fs1.e<i> == fs2.e<i>) ? 0xFFFFFFFF : 0;
  }
