# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: frem.pi
long_name: Packed integer divide remainder
description: |
  Performs signed integer division of the 32-bit integer values in vector register fs1 by the 32-bit integer
  values in vector register fs2, rounding towards zero, and writes the 32-bit remainder to vector register fd.
  The remainder of division by zero equals the dividend. Signed division overflow occurs when the most-negative 32bit integer is divided by -1. The remainder of a signed division with overflow is zero.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.

  Note: In the ET-SoC-1, this instruction traps to M-mode with cause 30 ("M-code emulation") and is emulated in
  firmware.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 0001111----------010-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) {
  if (fs1.e<i> == 0x80000000 && fs2.e<i> == -1) {
  fd.e<i> = 0;
  } else if (fs2.e<i> == 0) {
  fd.e<i> = fs1.e<i>;
  } else {
  fd.e<i> = fs1.e<i> % fs2.e<i>;
  }
  }
  }
