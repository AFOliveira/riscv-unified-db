$schema: inst_schema.json#
kind: instruction
name: tensorquant
long_name: TensorQuant
description: |
  Perform quantization or other transformations on the A matrix in scratchpad. Used to
  convert between data formats for efficient tensor operations.
  Encoded as CSRRW to tensor_quant CSR (0x806).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000000110-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  fstart = FREG;
  cols = (ACOLS + 1) * 4;
  rows = AROWS + 1;
  line = START % 48;
  for (k = 0; k < 10; k++) {
  trans = TXF<k>;
  switch (trans) {
  case LAST:
  return;
  case INT32_TO_FP32:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = i32_to_f32(f[reg].e<j%8>);
  }
  }
  break;
  case FP32_TO_INT32:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = f32_to_i2(f[reg].e<j%8>, rdyn);
  }
  }
  break;
  case RELU:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = max(f[reg].e<j%8>, 0);
  }
  }
  break;
  case INT32_ADD_ROW:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = f[reg].e<j%8> + L1Scp[line].e[j];
  }
  }
  line = (line + 1) % 48;
  break;
  case INT32_ADD_COL:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = f[reg].e<j%8> + L1Scp[line].e[i];
  }
  }
  line = (line + 1) % 48;
  break;
  case FP32_MUL_ROW:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  
  f[reg].e<j%8> = f32_mul(f[reg].e<j%8>, L1Scp[line].e[j]);
  }
  }
  line = (line + 1) % 48;
  break;
  case FP32_MUL_COL:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = f32_mul(f[reg].e<j%8>, L1Scp[line].e[i]);
  }
  }
  line = (line + 1) % 48;
  break;
  case SATINT8:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = max(-128, min(127, f[reg].e<j%8>)) & 0xFF;
  }
  }
  break;
  case SATUINT8:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  reg = (fstart + i*2 + j/8) % 32;
  f[reg].e<j%8> = max(0, min(255, f[reg].e<j%8>)) & 0xFF;
  }
  }
  break;
  case PACK128B:
  for (i = 0; i < rows; i++) {
  for (j = 0; j < cols; j++) {
  f[(fstart + i*2) % 32].b<j> =
  f[(fstart + i*2 + j/8) % 32].b<(4*j)%8>;
  }
  }
  break;
  }
  }
