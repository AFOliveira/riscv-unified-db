  of one hart, not an ET-Minion core pair, Shire, or full ET-SoC-1 topology.
mandatory_extensions:
- name: I
  version: ">= 2.1.0"
- name: M
  version: ">= 2.0.0"
- name: F
  version: ">= 2.2.0"
- name: C
  version: ">= 2.0.0"
- name: Zicsr
  version: ">= 2.0.0"
- name: Zifencei
  version: ">= 2.0.0"
- name: Xaifoundry
  version: ">= 1.0.0"
params:
  MXLEN: 64
  HART_COUNT: 1
  ET_MINION_HARTS: 1
