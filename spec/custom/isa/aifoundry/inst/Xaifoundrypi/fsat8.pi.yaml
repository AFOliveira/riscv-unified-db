# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsat8.pi
long_name: Packed integer saturate 8 bit
description: |
  Converts the 32-bit signed integer values in vector register fs1, to 8-bit signed integer values, and
  writes the zero-extended result to the 32-bit elements in vector register fd.
  If the 32-bit input value is not representable in the destination format, it is saturated to the nearest 8-bit value.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 000001100000-----011-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) {
  if (fs1.e<i> > 127) {
  fd.e<i> = 127;
  } else if (fs.e<1> < -128) {
  fd.e<i> = -128;
  } else {
  fd.e<i> = fs1.e<i>;
  }
  }
  }
