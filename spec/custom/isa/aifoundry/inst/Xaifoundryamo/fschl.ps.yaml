# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fschl.ps
long_name: Scatter 16-bit words to local memory
description: |
  16-bit vector scatter to local memory.

  Exceptions: Each of the gather virtual addresses must be aligned to a 16b boundary. Otherwise an access fault
  exception is generated.
  Restrictions: None
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryamo
encoding:
  match: 1100100----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fs3, fs1(rs2)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if ( m0.bit0 ) LOCAL_MEM(rs2 + fs1.e0, 16) = fs3.h0
  if ( m0.bit1 ) LOCAL_MEM(rs2 + fs1.e1, 16) = fs3.h1
  if ( m0.bit2 ) LOCAL_MEM(rs2 + fs1.e2, 16) = fs3.h2
  if ( m0.bit3 ) LOCAL_MEM(rs2 + fs1.e3, 16) = fs3.h3
  if ( m0.bit4 ) LOCAL_MEM(rs2 + fs1.e4, 16) = fs3.h4
  if ( m0.bit5 ) LOCAL_MEM(rs2 + fs1.e5, 16) = fs3.h5
  if ( m0.bit6 ) LOCAL_MEM(rs2 + fs1.e6, 16) = fs3.h6
  if ( m0.bit7 ) LOCAL_MEM(rs2 + fs1.e7, 16) = fs3.h7
