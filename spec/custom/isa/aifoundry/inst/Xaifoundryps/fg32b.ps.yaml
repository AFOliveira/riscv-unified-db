# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fg32b.ps
long_name: Gather bytes from 32-byte aligned block
description: |
  Gather bytes from a 32-byte aligned block.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 0000100----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  if (m0 != 0) {
  tmp = MEM(rs2[63:5] << 5, VLEN);
  for (i = 0; i < VLEN/32; i++) {
  m = (rs2[4:0] + rs1[5*n+4:5*n]) % 32;
  if (m0.bit<i>) fd.e<i> = sext(tmp[8*m+7:8*m], 32);
  }
  }
