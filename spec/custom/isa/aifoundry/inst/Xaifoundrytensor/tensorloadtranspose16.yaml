# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorloadtranspose16
long_name: TensorLoadTranspose16
description: |
  Load 16-bit data from memory with transposition into L1 scratchpad.
  Encoded as CSRRW to tensor_load CSR (0x83F).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000111111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
