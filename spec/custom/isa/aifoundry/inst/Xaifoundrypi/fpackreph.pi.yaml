# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fpackreph.pi
long_name: Pack and replicate halfword
description: |
  Pack and replicate halfword values from the packed integer source register,
  writing the result to the destination packed integer register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 001001100000-----001-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  for (i = 0; i < VLEN/32; i++) {
  k = i % (VLEN/64);
  if (m0.bit<i>) fd.e<i> = fs1.h<4*k> | (fs1.h<4*k+2> << 16);
  }
