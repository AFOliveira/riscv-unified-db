# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.ps.pwu
long_name: Floating point convert unsigned packed single packed word unsigned packed single
description: |
  Converts the unsigned 32-bit values in vector register fs1 to single-precision floating-point numbers,
  using the rounding mode specified in the rm field, and writes the results to vector register fd.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 110100000001-------------1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: rd
      location: 11-7
assembly: fd, fs1, rm
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  fd.e<i> = ui32_to_f32(fs1.e<i>);
  }
