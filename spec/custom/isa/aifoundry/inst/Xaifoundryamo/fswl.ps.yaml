# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fswl.ps
long_name: Packed store to local memory
description: |
  32-bit vector store to local memory.

  Exceptions: Virtual address (rs1) must be aligned to a 256b boundary. Otherwise an access fault exception is
  generated.
  Restrictions: None
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryamo
encoding:
  match: 010100000000-----111-----0001011
  variables:
    - name: rs1
      location: 19-15
    - name: rs2
      location: 11-7
assembly: fs3, (rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if ( m0.bit0 ) LOCAL_MEM(rs1 + 0, 32) = fs3.e0
  if ( m0.bit1 ) LOCAL_MEM(rs1 + 4, 32) = fs3.e1
  if ( m0.bit2 ) LOCAL_MEM(rs1 + 8, 32) = fs3.e2
  if ( m0.bit3 ) LOCAL_MEM(rs1 + 12, 32) = fs3.e3
  if ( m0.bit4 ) LOCAL_MEM(rs1 + 16, 32) = fs3.e4
  if ( m0.bit5 ) LOCAL_MEM(rs1 + 20, 32) = fs3.e5
  if ( m0.bit6 ) LOCAL_MEM(rs1 + 24, 32) = fs3.e6
  if ( m0.bit7 ) LOCAL_MEM(rs1 + 28, 32) = fs3.e7
