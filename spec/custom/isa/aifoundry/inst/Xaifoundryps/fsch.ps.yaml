# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsch.ps
long_name: Floating point scatter half word packed single
description: |
  Scatters the lower 16 bits of each of the eight 32-bit elements of the source register fd into eight arbitrary 16-bit memory locations. The effective addresses of the memory accesses are calculated by adding the 32-bit
  elements of register fs1, sign-extended to 64 bits, to the value in register rs2.
  If the instruction traps halfway through its execution the value of GSC_PROGRESS is updated with the next element to be processed.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update memory.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 1101000----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rs3
      location: 11-7
assembly: fs3, fs1(rs2)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (gsc_progress >= i && m0.bit<i>)
  MEM(rs2 + sext(fs1.e<i>,64), 16) = fd.h<2*i>;
  }
