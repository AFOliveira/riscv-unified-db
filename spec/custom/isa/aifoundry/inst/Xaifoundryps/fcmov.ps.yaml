# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcmov.ps
long_name: Floating point conditional move packed single
description: |
  For all 32-bit values in vector register fs1, when a value is zero select the corresponding 32-bit value
  in vector register fs3 else select the corresponding value in vector register fs2, and write the result to the vector
  register fd.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: -----10----------010-----0111111
  variables:
    - name: rs3
      location: 31-27
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2, fs3
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++ )
  {
  if ( m0.bit<i> ) fd.e<i> = fs1.e<i> != 0 ? fs2.e<i> : fs3.e<i>
  }
