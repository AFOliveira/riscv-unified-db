# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: aif.europeriscvsummit
long_name: Europe RISC-V Summit marker (ADDI-equivalent)
description: |
  Custom-1 I-type with ADDI semantics (X[rd] = X[rs1] + sign_extend(imm[11:0])).
  Encoding per approved encoding_plan.yaml; reference mnemonic is addi.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -----------------100-----0101011
  variables:
    - name: imm
      location: 31-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
assembly: xd, xs1, imm
access:
  s: always
  u: always
  vs: always
  vu: always
