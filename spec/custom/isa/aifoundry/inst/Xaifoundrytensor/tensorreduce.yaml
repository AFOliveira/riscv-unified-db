# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorreduce
long_name: TensorReduce
description: |
  Perform a reduction operation (e.g., sum, max) across the elements of the FP register
  accumulators. Used after matrix multiply to reduce partial results.
  Encoded as CSRRW to tensor_reduce CSR (0x800).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000000000-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  fstart = FREG;
  op = FUNCT;
  fnum = COUNT;
  height = HEIGHT;
  switch (mhartid % (1 << (height+2)) {
  case 0:
  // this ET-Minion is a sender
  partner = mhartid + (1 << (height+1));
  recv(partner, REDUCE_START);
  for (i = 0; i < fnum; i++) {
  send(partner, f[(fstart+i)%32].e<*>);
  }
  break;
  case 1 << (height+1):
  // this ET-Minion is a receiver
  partner = mhartid - (1 << (height+1));
  // notify sender that we can accept data
  send(partner, REDUCE_START);
  for (i = 0; i < fnum; i++) {
  
  // wait until data is available
  recv(partner, &temp);
  k = (fstart + i) % 32;
  for (j = 0; j < 8; j++) {
  switch (op) {
  case FADD: f[k].e<j> = f32_add(temp.e<j>, f[k].e<j>); break;
  case FMAX: f[k].e<j> = f32_max(temp.e<j>, f[k].e<j>); break;
  case FMIN: f[k].e<j> = f32_min(temp.e<j>, f[k].e<j>); break;
  case ADD : f[k].e<j> = temp.e<j> + f[k].e<j>; break;
  case MAX : f[k].e<j> = max(temp.e<j>, f[k].e<j>); break;
  case MIN : f[k].e<j> = min(temp.e<j>, f[k].e<j>); break;
  case MOVE: f[k].e<j> = temp.e<j>; break;
  }
  }
  }
  break;
  default:
  // this ET-Minion does nothing
  break;
  }?
