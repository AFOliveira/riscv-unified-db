# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fexp.ps
long_name: Floating point EXPONENTIAL packed single
description: |
  Computes an approximation within 1-ULP of the base-2 exponential function (i.e., 2x) of the singleprecision values in fs1, performs rounding using RTZ, and writes the single-precision results to the vector register
  fd. The table below shows the result for various classes of input:
  fs1

  fd

  SNaN

  QNaN

  -

  -0.0

  +0.0

  +

  *

  NaN

  +0.0

  +1.0

  +1.0

  +

  Where * means fd is set to default NaN and the Invalid operation floating-point exception flag is set. Also, any input
  value less than -126.0 is considered -8, and any input value greater than or equal to 128.0 is considered +8.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag. Subnormal outputs are flushed
  to zero, and set the underflow and inexact exception flags.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 010110000100-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = f32_exp2(fs1.e<i>);
  }
