# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmax.ps
long_name: Floating point maximum packed single
description: |
  Compares the single-precision values in vector register fs1 and the single-precision values in vector
  register fs2, and writes the maximum value to vector register fd.
  For the purposes of this instruction, the value -0 is considered to be less than the value +0. If both inputs are NaNs,
  the result is the canonical NaN. If only one operand is a NaN, the result is the non-NaN operand. Signaling NaN
  inputs set the invalid operation exception flag, even when the result is not NaN.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag.
  This operation does not read the rounding mode control in FRM.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 0010100----------001-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = f32_maximumNumber(fs1.e<i>, fs2.e<i>);
  }
