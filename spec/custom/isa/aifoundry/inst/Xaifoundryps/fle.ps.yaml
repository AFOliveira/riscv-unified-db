# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fle.ps
long_name: Floating point less than or equal to compare packed single
description: |
  Writes all 1s to each 32-bit element in register fd if the corresponding single-precision value in vector
  register fs1 is less than or equal to the single-precision value in vector register fs2, otherwise writes the value 0.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  For the purposes of this instruction, the value -0 is considered to be equal to the value +0. Signaling NaN inputs set
  the invalid operation exception flag. If any input is a NaN the result is 0.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 1010000----------000-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = f32_le(fs1.e<i>, fs2.e<i>) ? 0xFFFFFFFF : 0;
  }
