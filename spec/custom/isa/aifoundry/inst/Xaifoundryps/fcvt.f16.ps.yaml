# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.f16.ps
long_name: Floating point packed single down convert to FP 16-bit packed single
description: |
  Converts the single-precision values in vector register fs1 to half-precision floating-point numbers,
  using the rounding mode specified in FRM, zero-extends the values to 32 bits, and writes the results to the 32-bit
  elements of vector register fd.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag. Subnormal outputs are flushed
  to zero, and set the underflow and inexact exception flags.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 110110001001-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  fd.h<2*i> = f32_to_f16(fs1.e<i>);
  fd.h<2*i+1> = 0;
  }
