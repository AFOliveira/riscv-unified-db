# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fscbg.ps
long_name: Scatter byte global PS
description: |
  Scatter bytes to global memory using per-lane addresses via memory controller.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 1100001----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fs3, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  if ( m0.bit0 ) GLOBAL_MEM(rs2 + fs1.e0, 8) = fs3.b0
  if ( m0.bit1 ) GLOBAL_MEM(rs2 + fs1.e1, 8) = fs3.b1
  if ( m0.bit2 ) GLOBAL_MEM(rs2 + fs1.e2, 8) = fs3.b2
  if ( m0.bit3 ) GLOBAL_MEM(rs2 + fs1.e3, 8) = fs3.b3
  if ( m0.bit4 ) GLOBAL_MEM(rs2 + fs1.e4, 8) = fs3.b4
  if ( m0.bit5 ) GLOBAL_MEM(rs2 + fs1.e5, 8) = fs3.b5
  if ( m0.bit6 ) GLOBAL_MEM(rs2 + fs1.e6, 8) = fs3.b6
  if ( m0.bit7 ) GLOBAL_MEM(rs2 + fs1.e7, 8) = fs3.b7
