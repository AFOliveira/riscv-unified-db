# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fremu.pi
long_name: Packed integer remainder unsigned
description: |
  Perform element-wise unsigned integer remainder across all 8 INT32 lanes
  of the packed integer source registers, writing the remainder to the
  destination packed integer register. Software emulated via trap to M-mode.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 0001111----------011-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) {
  if (fs2.e<i> == 0) {
  fd.e<i> = fs1.e<i>;
  } else {
  fd.e<i> = fs1.e<i> % fs2.e<i>;
  }
  }
  }
  Note: In the ET-SoC-1, this instruction traps to M-mode with cause 30 (“M-code emulation”) and is emulated in
  firmware.
