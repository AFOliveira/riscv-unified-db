# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: cache.evictsw
long_name: Cache Evict by Set/Way
description: |
  Evict cache line by set and way index. Encoded as CSRRW to CSR 0x7F9 (M-mode).
  The source register rs1 contains the set and way parameters.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrycache
base: 32
encoding:
  match: 011111111001-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": "None"
