# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: aif.mul
long_name: AgentWS dry-run integer multiply
description: |
  Pipeline dry-run instruction semantically equivalent to RV64M `mul`. Custom-0
  R-type encoding (funct7=0x2c, funct3=111) beside `aif.felix` and `aif.add`.
definedBy:
  anyOf:
    - Xaifoundry
base: 32
encoding:
  match: 0101100----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: rd, rs1, rs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): X[rd] = (X[rs1] * X[rs2])[XLEN-1:0];
