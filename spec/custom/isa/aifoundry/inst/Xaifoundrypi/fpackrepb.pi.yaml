# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fpackrepb.pi
long_name: Pack four bytes and replicate over the 256-bit register packed integer
description: |
  Concatenates the lower 8 bits of each 32-bit element in vector register fs1, replicates the result four
  times, and writes it to the vector register fd.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 001001100000-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  k = i % (VLEN/128);
  if (m0.bit<i>) fd.e<i> = fs1.h<16*k>
  | (fs1.h<16*k+4> << 8)
  | (fs1.h<16*k+8> << 16)
  | (fs1.h<16*k+12> << 24);
  }
