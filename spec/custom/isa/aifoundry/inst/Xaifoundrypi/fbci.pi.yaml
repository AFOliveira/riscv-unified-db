# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fbci.pi
long_name: Packed integer broadcast of 20-bit immediate to floating point register
description: |
  Sign-extends the 20-bit immediate in the instruction to 32 bits and broadcasts this value into each 32bit element in the destination register fd.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: -------------------------1011111
  variables:
    - name: imm
      location: 31-12
    - name: rd
      location: 11-7
assembly: fd, imm20
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  tmp = sext(imm20, 32);
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = tmp;
  }
