# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flt.ps
long_name: Packed single compare less-than
description: |
  Packed single compare less-than.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 1010000----------001-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = f32_lt(fs1.e<i>, fs2.e<i>) ? 0xFFFFFFFF : 0;
  }
