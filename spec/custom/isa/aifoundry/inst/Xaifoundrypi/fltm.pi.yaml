# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fltm.pi
long_name: Packed integer less than mask
description: |
  Writes the value 1 to each mask register md bit if the corresponding 32-bit signed integer value in
  vector register fs1 is less than the 32-bit signed integer value in vector register fs2, otherwise writes the value 0.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 0011111----------00000---1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 9-7
assembly: md, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) md.bit<i> = (fs1.e<i> < fs2.e<i>) ? 1 : 0;
  }
