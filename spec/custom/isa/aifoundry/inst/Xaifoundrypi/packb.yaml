# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: packb
long_name: Pack 32 bits from operands
description: |
  Pack low bytes from two integer source registers into the destination
  integer register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 1000000----------110-----0111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
