# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmaxu.pi
long_name: Packed integer maximum unsigned
description: |
  Compares the 32-bit unsigned integer values in vector register fs1 and the 32-bit unsigned integer
  values in vector register fs2, and writes the larger value to vector register fd.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 0010111----------011-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = (fs1.e<i> < fs2.e<i>) ? fs2.e<i> : fs1.e<i>;
  }
