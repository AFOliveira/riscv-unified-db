# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: cache.evictva
long_name: Cache Evict by Virtual Address
description: |
  Evict cache line by virtual address. Encoded as CSRRW to CSR 0x89F (U-mode).
  The source register rs1 contains the virtual address.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrycache
base: 32
encoding:
  match: 100010011111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": "None"
