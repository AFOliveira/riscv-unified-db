# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorloadsetupb
long_name: TensorLoadSetupB
description: |
  Configure the tensor load unit for loading the B matrix in column-major order for
  matrix multiply operations.
  Encoded as CSRRW to tensor_load CSR (0x83F).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000111111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  VA = sext(ADDR << 6, 64);
  count = ROWS + 1;
  stride = zext(STRIDE << 6, 64);
  for (i = 0; i < count; i++) {
  if (!TenB.full()) {
  TenB.next[*] = MEM(VA + i*stride, 512);
  }
  }
