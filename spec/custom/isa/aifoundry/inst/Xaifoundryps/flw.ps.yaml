# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flw.ps
long_name: Load word packed single
description: |
  Load eight consecutive 32-bit values (256 bits) from memory into a packed-single register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -----------------010-----0001011
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  addr = rs1 + sext(offset, 64);
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e0 = MEM(addr + 4*i, 32);
  }
