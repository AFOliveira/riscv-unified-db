# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fbc.ps
long_name: Floating point broadcast packed single
description: |
  Broadcasts a 32 bit value from memory into eight consecutive 32-bit elements of a floating point register (fd). The effective address of the broadcast is calculated by adding a signed immediate offset to the value in
  register rs1.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: -----------------000-----0001011
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, offset(rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (m0 != 0) {
  tmp = MEM(rs1 + sext(offset, 64), 32);
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = tmp;
  }
  }
