# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: packb
long_name: Pack 32 bit packed integer
description: |
  Pack 32-bit from the first and second operands.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 1000000----------110-----0111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: rd, rs1, rs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  rd[7:0] = rs1[7:0]
  rd[15:8] = rs2[7:0]
  rd[63:16] = 0
