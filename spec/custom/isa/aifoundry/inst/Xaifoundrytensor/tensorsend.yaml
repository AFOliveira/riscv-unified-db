# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorsend
long_name: TensorSend
description: |
  Send values from floating-point registers to the tensor execution unit for processing.
  Encoded as CSRRW to tensor_reduce CSR (0x800).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000000000-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  fstart = FREG;
  fnum = COUNT;
  partner = 2*TARGET;
  // wait until the receiver is ready to accept data
  recv(partner, REDUCE_START);
  
  for (i = 0; i < fnum; i++) {
  send(partner, f[(fstart+i)%32]);
  }
