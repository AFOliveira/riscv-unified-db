$schema: inst_schema.json#
kind: instruction
name: aif.europeriscvsummit
long_name: Europe RISC-V Summit custom ADDI
description: |
  Custom-1 I-type instruction with ADDI semantics
  (X[rd] = X[rs1] + sign_extend(imm[12:0])).
definedBy:
  anyOf:
    - Xaifoundry
base: 32
encoding:
  match: -----------------100-----0101011
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, imm
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): X[rd] = X[rs1] + $signed(imm);
