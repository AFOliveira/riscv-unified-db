# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorloadinterleave16
long_name: TensorLoadInterleave16
description: |
  Load 16-bit data from memory with interleaving pattern into L1 scratchpad.
  Encoded as CSRRW to tensor_load CSR (0x83F).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000111111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  usemsk = (MSK == 1);
  dst = START;
  VA = sext(ADDR << 5, 64);
  count = ROWS + 1;
  stride = zext(STRIDE << 6, 64);
  
  for (i = 0; i < count; i++) {
  if (!usemsk || tensor_mask[i] == 1) {
  // Load and interleave 2x32B
  for (r = 0; r < 2; r++) {
  temp = MEM(VA + (i * 2 + r) * stride, 256);
  for (c = 0; c < 16; c++) {
  L1Scp[(dst + i) % 48].h[c*2 + r] = temp.h[c];
  }
  }
  }
  }
