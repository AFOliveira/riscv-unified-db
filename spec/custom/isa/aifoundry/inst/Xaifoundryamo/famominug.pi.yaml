# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famominug.pi
long_name: Atomic min unsigned global PI
description: |
  Atomically compute the unsigned minimum of each PI lane value and global memory
  via memory controller. Returns the original memory values.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 1011111----------100-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  for (i = 0; i < 8; i++ ) {
  address = rs2 + fs1.e<i>
  value = fd.e<i>
  if ( m0.bit<i>) fd.e<i> = atomic_global_minu(address, value, 32)
  }
