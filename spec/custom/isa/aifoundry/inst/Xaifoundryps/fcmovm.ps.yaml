# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcmovm.ps
long_name: Floating point conditional move mask packed single
description: |
  For all mask register m0 bits, when a bit is zero select the corresponding 32-bit value in vector register fs2 else select the corresponding value in vector register fs1, and write the result to the vector register fd.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 0000000----------000-----1110111
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++ ) {
  fd.e<i> = m0.bit<i> ? fs1.e<i> : fs2.e<i>
  }
