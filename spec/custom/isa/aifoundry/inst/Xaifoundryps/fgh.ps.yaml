# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fgh.ps
long_name: Floating point gather half word packed single
description: |
  Gathers eight arbitrary 16-bit memory locations, sign-extends the values to 32 bits, and stores them
  in the eight 32-bit elements of the destination register fd. The effective addresses of the memory accesses are calculated by adding the 32-bit elements of register fs1, sign-extended to 64 bits, to the value in register rs2.
  If the instruction traps halfway through its execution the value of GSC_PROGRESS is updated with the next element to be processed.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 0101000----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1(rs2)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (gsc_progress >= i && m0.bit<i>)
  fd.e<i> = sext(MEM(rs2 + sext(fs1.e<i>,64), 16), 32);
  }
