# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fg32w.ps
long_name: Gather words from 32-byte aligned block
description: |
  Gather words from a 32-byte aligned block.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 0010000----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  if (m0 != 0) {
  tmp = MEM(rs2[63:5] << 5, VLEN);
  for (i = 0; i < VLEN/32; i++) {
  m = (rs2[4:2] + rs1[3*n+2:3*n]) % 8;
  if (m0.bit<i>) fd.e<i> = tmp[32*m+31:32*m];
  }
  }
