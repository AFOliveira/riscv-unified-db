$schema: csr_schema.json#
kind: csr
name: flush_sw
long_name: Flush Set/Way Cache Operation
address: 0x7fb
priv_mode: M
length: 64
writable: true
description: |
  Target CSR for `CSRRW xd, flush_sw, xs`. A write flushes one or more
  L1 data-cache set/way lines by writing dirty data through DestLevel-1
  to DestLevel while retaining clean copies. DestLevel=L1 is a NOP. This
  CSR is machine-mode only.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrycache
fields:
  UseTensorMask:
    location: 63
    type: RW
    reset_value: 0
    description: Use tensor_mask to skip operation n when mask bit n is clear.
  Reserved62_60:
    location: 62-60
    type: RW-R
    reset_value: 0
    description: Reserved, WARL(0).
    sw_write(csr_value): return 0;
  DestLevel:
    location: 59-58
    type: RW
    reset_value: 0
    description: "Destination level: 0=L1, 1=L2, 2=L3, 3=memory."
  Reserved57_18:
    location: 57-18
    type: RW-R
    reset_value: 0
    description: Reserved, WARL(0).
    sw_write(csr_value): return 0;
  Set:
    location: 17-14
    type: RW
    reset_value: 0
    description: L1 cache set. In C0 mode this selects the physical L1 set directly.
  Reserved13_8:
    location: 13-8
    type: RW-R
    reset_value: 0
    description: Reserved, WARL(0).
    sw_write(csr_value): return 0;
  Way:
    location: 7-6
    type: RW
    reset_value: 0
    description: L1 cache way.
  Reserved5_4:
    location: 5-4
    type: RW-R
    reset_value: 0
    description: Reserved, WARL(0).
    sw_write(csr_value): return 0;
  NumLines:
    location: 3-0
    type: RW
    reset_value: 0
    description: Number of cache lines minus one; repeated operations increment set and wrap to the next way.
sw_read(): return 0;
