# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.ps.un2
long_name: Up-convert UNorm2 to FP32
description: |
  Up-convert UNorm2 to FP32.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 110100010111-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: |
  for (i = 0; i < VLEN/32; i++) {
    if (m0.bit<i>) fd.e<i> = unorm2_to_f32(fs1.e<i>);
  }
