# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorwait
long_name: TensorWait
description: |
  Stall the pipeline until all outstanding tensor operations have completed. Must be used
  before reading tensor results to ensure data is ready.
  Encoded as CSRRW to tensor_wait CSR (0x830).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000110000-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
custom_pseudocode: "stall_until_event(xs1[3:0]); xd = 0;"
