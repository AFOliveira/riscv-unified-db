# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsqrt.ps
long_name: Floating point square root packed single
description: |
  Computes the square root of the single-precision values in vector register fs1, performs rounding
  using RNE, and writes the single-precision results to vector register fd. The result is an approximation within 1-ULP
  of the IEEE 754-2008 expected square root result.
  The mask register m0 is used to control execution. Inactive elements shall not generate exceptions and shall not
  update the destination.
  Subnormal inputs are treated as zeros, and set the input denormal exception flag. Subnormal outputs are flushed
  to zero, and set the underflow and inexact exception flags.

  Note: In the ET-SoC-1 this instruction traps to M-mode with cause 30 ("M-code emulation") and is emulated in firmware.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: 010110000000-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = f32_sqrt(fs1.e<i>, fs2.e<i>);
  }
