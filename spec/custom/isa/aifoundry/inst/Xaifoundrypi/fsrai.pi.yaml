# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsrai.pi
long_name: Packed integer shift right arithmetic with immediate
description: |
  Shifts the 32-bit values in vector register fs1 right (shifting in copies of the sign bit into the upper bits)
  by the shift amount specified in the 5-bit unsigned immediate operand, and writes the 32-bit results to the vector
  register fd.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 0100111----------111-----1111011
  variables:
    - name: shamt
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, imm5
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = fs1.e<i> >> imm5;
  }
