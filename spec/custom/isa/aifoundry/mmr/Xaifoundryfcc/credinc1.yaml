$schema: mmr_schema.json#
kind: mmr
name: credinc1
long_name: Credit Increment Register 1
description: |
  Memory-mapped register to increment fast credit counter 1.
  Writing to this register adds credits to the specified counter.
definedBy:
  extension:
    name: Xaifoundryfcc
physical_address: 0x1c03400c8
length: 64
writable: true
fields:
  MASK1:
    location: 7-0
    type: RW
    reset_value: 0
    description: |
      Bitmask selecting which cores' credit counters to increment.
