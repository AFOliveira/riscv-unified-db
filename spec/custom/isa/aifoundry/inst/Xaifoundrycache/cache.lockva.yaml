# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: cache.lockva
long_name: Cache Lock by Virtual Address
description: |
  Lock cache line by virtual address. Encoded as CSRRW to CSR 0x8DF (U-mode).
  The source register rs1 contains the virtual address.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrycache
base: 32
encoding:
  match: 100011011111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  PA = translate(xs1[47:6]);
  for (i = 0; i < xs1[3:0] + 1; i++) {
    if (!xs1[63] || tensor_mask[i] == 1) {
      cache_zero_and_softlock(PA + i * stride);
    }
  }
  xd = 0;
