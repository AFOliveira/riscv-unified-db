# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorbroadcast
long_name: TensorBroadcast
description: |
  Broadcast values from FP registers to the tensor unit for use as operands in subsequent
  tensor operations.
  Encoded as CSRRW to tensor_reduce CSR (0x800).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000000000-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
