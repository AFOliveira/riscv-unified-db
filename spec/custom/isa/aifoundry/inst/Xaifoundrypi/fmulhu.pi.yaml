# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmulhu.pi
long_name: Packed integer unsigned multiplication upper 32-bits
description: |
  Performs a 32-bit unsigned integer multiplication between each 32b component in src1 and src2 and
  returns the higher 32-bits of the result.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: 0001011----------010-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < 8; i++ )
  {
  if ( m0.bit<i> ) fd.e<i> = (fs1.e<i> * fs2.e<i> ) >> 32
  }
