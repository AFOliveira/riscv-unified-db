$schema: inst_schema.json#
kind: instruction
name: tensorload
long_name: TensorLoad
description: |
  Load data from memory address (rs1 + offset) into the L1 data cache scratchpad for use
  by tensor operations. The data is loaded into consecutive scratchpad lines.
  Encoded as CSRRW to tensor_load CSR (0x83F).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000111111-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  usemsk = (MSK == 1);
  dst = START;
  VA = sext(ADDR << 6, 64);
  count = ROWS + 1;
  stride = zext(STRIDE << 6, 64);
  if (!usemsk || tensor_mask != 0) {
  // Load 16 x 4*count bytes
  for (i = 0; i < 16; i++) {
  
  for (c = 0; c < 16; c++) {
  L1Scp[(dst + r) % 48].e[c] = temp[c].e[r];
  }
  }
  }
