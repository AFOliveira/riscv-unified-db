# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fandi.pi
long_name: Packed integer AND immediate operation
description: |
  Performs bit-wise AND of the 32-bit values in vector register fs1 and the sign-extended 10-bit immediate operand, and writes the result to vector register fd.
  The mask register m0 is used to control execution. Inactive elements shall not update the destination.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundrypi
encoding:
  match: -----10----------001-----0111111
  variables:
    - name: imm9_5
      location: 31-27
    - name: imm4_0
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, imm10
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  for (i = 0; i < VLEN/32; i++) {
  if (m0.bit<i>) fd.e<i> = fs1.e<i> & sext(imm10, 32);
  }
