$schema: inst_schema.json#
kind: instruction
name: tensorfma16a32
long_name: TensorFMA16A32
description: |
  Multiply two FP16 matrices (A and B) from scratchpad, add the FP32 result to the FP32
  accumulator matrix C0 stored in FP registers (f0-fN), and write the result back to FP
  registers. This is the primary operation for ML inference with FP16 precision.
  Encoded as CSRRW to tensor_fma CSR (0x801).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 100000000001-----001-----1110011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  usemsk = (MSK == 1);
  bcols = (BCOLS + 1) * 4;
  arows = AROWS + 1;
  acols = (ACOLS + 1) * 2;
  offset = AOFFSET * 2;
  l1scpb = (TENB == 0);
  bstart = BSTART;
  astart = ASTART;
  for (k = 0; k < acols; k += 2) {
  tmp = l1scpb ? L1Scp[(bstart+k/2)%48] : TenB[k/2];
  for (i = 0; i < arows; i++) {
  if (usemsk && !tensor_mask[i]) {
  if (MUL && k == 0) {
  for (j = 0; j < bcols; j++) {
  f[i*2+j/8].e<j%8> = 0;
  }
  }
  continue;
  }
  a1 = L1Scp[(astart+i)%48].h[offset+k+0];
  a2 = L1Scp[(astart+i)%48].h[offset+k+1];
  
  for (j = 0; j < bcols; j++) {
  b1 = tmp.h[j*2+0];
  b2 = tmp.h[j*2+1];
  if (MUL && k == 0) {
  // c = a1*b1 + a2*b2
  f[i*2+j/8].e<j%8> = f1632_mulAdd2(a1, b1, a2, b2);
  } else if (a1 != 0 && a2 != 0 && b1 != 0 && b2 != 0) {
  // c = c + a1*b1 + a2*b2
  c = f[i*2+j/8].e<j%8>;
  f[i*2+j/8].e<j%8> = f1632_mulAdd3(a1, b1, a2, b2, c);
  }
  }
  }
  }
