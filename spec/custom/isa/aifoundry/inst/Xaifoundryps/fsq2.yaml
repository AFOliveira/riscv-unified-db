# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsq2
long_name: Floating point store unmasked 256-bits
description: |
  Stores the data in source register fd into 256 consecutive bits in memory. The effective address of the
  store is calculated by adding a signed immediate offset to the value in register rs1.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: -----------------101-----0100111
  variables:
    - name: imm
      location: 31-25|11-7
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
assembly: fs2, offset(rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  MEM(rs1 + sext(offset,64), 256) = fs2[*];
