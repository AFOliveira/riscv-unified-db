# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.f16.ps
long_name: Down-convert FP32 to FP16
description: |
  Down-convert 8 FP32 to FP16.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 110110001001-----000-----1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  for (i = 0; i < VLEN/32; i++) {
  fd.h<2*i> = f32_to_f16(fs1.e<i>);
  fd.h<2*i+1> = 0;
  }
