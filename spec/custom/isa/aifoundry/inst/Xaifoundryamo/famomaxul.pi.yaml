# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famomaxul.pi
long_name: Atomic max unsigned local PI
description: |
  Atomically compute the unsigned maximum of each PI lane value and local memory
  at shire cache level. Returns the original memory values.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 0100011----------100-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
"operation()": |
  for (i = 0; i < 8; i++ ) {
  address = rs2 + fs1.e<i>
  value = fd.e<i>
  if ( m0.bit<i>) fd.e<i> = atomic_local_maxu(address, value, 32)
  }
