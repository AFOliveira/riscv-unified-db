# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flq2
long_name: Floating point load unmasked 256-bits
description: |
  Loads 256 consecutive bits from memory and stores them in the destination register fd. The effective
  address of the load is calculated by adding a signed immediate offset to the value in register rs1.
definedBy:
  anyOf:
    - extension:
        name: Xaifoundry
    - extension:
        name: Xaifoundryps
encoding:
  match: -----------------101-----0000111
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, offset(rs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  fd = MEM(rs1 + sext(offset, 64), 256)
