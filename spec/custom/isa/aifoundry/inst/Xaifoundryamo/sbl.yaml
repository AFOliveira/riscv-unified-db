# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: sbl
long_name: Store byte local
description: |
  Store a byte to local (shire) memory.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 0001000----------011000000111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
assembly: xs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
